name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two production deploys overlap. Queued instead of cancelled so a
# pushed commit is never left undeployed.
concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

jobs:
  verify:
    name: Verify (tests, gold set, web build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install API dependencies
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        working-directory: services/api
        run: pytest tests -q

      - name: Gold-set evaluation gate
        working-directory: services/api
        run: python evaluate.py --min-case-accuracy 0.90

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build the web app
        working-directory: apps/web
        run: |
          npm ci
          npm run build

  deploy-api:
    name: Deploy API to Vercel
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Check the Vercel token
        run: |
          VERCEL_TOKEN="$(printf '%s' "$VERCEL_TOKEN" | tr -d '\r\n')"
          echo "token length: ${#VERCEL_TOKEN}"
          if ! out=$(vercel whoami --token="$VERCEL_TOKEN" 2>&1); then
            echo "::error::The Vercel token is expired or invalid."
            echo "::error::vercel whoami said: ${out}"
            echo "::error::Create a new token in Vercel (Settings -> Tokens), then update the repository secret: gh secret set VERCEL_TOKEN --body '<new token>'"
            exit 1
          fi
          echo "Vercel token is valid"
          echo "VERCEL_TOKEN=$VERCEL_TOKEN" >> "$GITHUB_ENV"

      - name: Pull Vercel project settings
        working-directory: services/api
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # The dashboard reads the authorities' own portals. This is the switch
      # that says so to the deployed API; change it here if the demo feed is
      # wanted back.
      - name: Point the API at the live portals
        working-directory: services/api
        run: vercel env add BMS_FIXTURES --environment production --value false --force --yes --token="$VERCEL_TOKEN"

      - name: Deploy to production
        working-directory: services/api
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"

  deploy-web:
    name: Deploy web to Vercel
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Check the Vercel token
        run: |
          VERCEL_TOKEN="$(printf '%s' "$VERCEL_TOKEN" | tr -d '\r\n')"
          echo "token length: ${#VERCEL_TOKEN}"
          if ! out=$(vercel whoami --token="$VERCEL_TOKEN" 2>&1); then
            echo "::error::The Vercel token is expired or invalid."
            echo "::error::vercel whoami said: ${out}"
            echo "::error::Create a new token in Vercel (Settings -> Tokens), then update the repository secret: gh secret set VERCEL_TOKEN --body '<new token>'"
            exit 1
          fi
          echo "Vercel token is valid"
          echo "VERCEL_TOKEN=$VERCEL_TOKEN" >> "$GITHUB_ENV"

      - name: Pull Vercel project settings
        working-directory: apps/web
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy to production
        working-directory: apps/web
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"

  smoke:
    name: Smoke test the live deployment
    needs: [deploy-api, deploy-web]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the API to answer
        env:
          API_URL: ${{ vars.VERCEL_API_URL || 'https://bms-ahte-api.vercel.app' }}
        run: |
          for i in $(seq 1 40); do
            if curl -sf "$API_URL/api/health" > /dev/null; then
              echo "API is live at $API_URL"
              curl -sf "$API_URL/api/health"
              exit 0
            fi
            echo "waiting for API ($i)..."
            sleep 5
          done
          echo "::error::API did not become healthy"
          exit 1

      - name: Check the web app
        env:
          WEB_URL: ${{ vars.VERCEL_WEB_URL || 'https://bms-ahte.vercel.app' }}
        run: |
          curl -sf -o /dev/null -w "web status %{http_code}\n" "$WEB_URL/"
          curl -sf -o /dev/null -w "web login status %{http_code}\n" "$WEB_URL/login"

      - name: Check the API is reading the live portals
        env:
          API_URL: ${{ vars.VERCEL_API_URL || 'https://bms-ahte-api.vercel.app' }}
        run: |
          body=$(curl -sf "$API_URL/api/health")
          echo "$body"
          if echo "$body" | grep -q '"fixtures":true'; then
            echo "::error::The API is still reading saved captures instead of the live portals."
            echo "::error::Check the BMS_FIXTURES environment variable on the Vercel API project."
            exit 1
          fi
          echo "The API is reading the live portals"
