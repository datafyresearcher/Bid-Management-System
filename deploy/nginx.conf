# Reverse proxy for the self-hosted BMS stack.
#
# The browser talks to this one port only. Everything under /api (and the
# API's documentation pages) is forwarded to the API container; everything
# else is the Next.js frontend. Same origin also means no CORS configuration
# to get wrong: the browser never notices that two services answered.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/log/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    off;
    sendfile      on;

    # BOQ files, tender documents and the capture bridge's page snapshots all
    # arrive as uploads; the default 1 MB limit would reject them.
    client_max_body_size 100m;

    upstream bms_api {
        server api:8000;
    }

    upstream bms_web {
        server web:3000;
    }

    server {
        listen 80;
        server_name _;

        # The API answers on its own /api prefix, so the path is passed
        # through untouched (no trailing slash on proxy_pass).
        location /api/ {
            proxy_pass http://bms_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Sign-in rate limiting keys on the client address; without the
            # forwarded header every sign-in would look like it came from
            # nginx itself.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Scoring, portal scans and document processing are slow on
            # purpose — these are government portals and model calls.
            proxy_connect_timeout 10s;
            proxy_send_timeout    180s;
            proxy_read_timeout    180s;
        }

        # FastAPI's own documentation, served from the same API container.
        location ~ ^/(docs|redoc|openapi\.json)$ {
            proxy_pass http://bms_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else is the frontend.
        location / {
            proxy_pass http://bms_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Next.js hot module replacement over websockets (dev only, but
            # harmless in production and cheap to leave on).
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
